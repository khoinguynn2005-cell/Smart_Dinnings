<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 17px Arial, sans-serif; fill: #4b5563; }
      .laneTitle { font: 700 21px Arial, sans-serif; fill: #1f2937; }
      .actionText { font: 19px Arial, sans-serif; fill: #1f2937; text-anchor: middle; }
      .smallText { font: 15px Arial, sans-serif; fill: #374151; text-anchor: middle; }
      .label { font: 16px Arial, sans-serif; fill: #374151; }
      .flow { fill: none; stroke: #374151; stroke-width: 3; marker-end: url(#arrow); }
      .customer { fill: #e8f2ff; stroke: #4b86c3; stroke-width: 2.5; }
      .system { fill: #fff6d9; stroke: #c9982c; stroke-width: 2.5; }
      .operations { fill: #e8f6e9; stroke: #5d9b6d; stroke-width: 2.5; }
      .decision { fill: #fffdf2; stroke: #b68424; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L10 5.5 L0 11 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <text x="960" y="42" class="title" text-anchor="middle">ACTIVITY DIAGRAM – QUY TRÌNH GỌI MÓN CỦA KHÁCH HÀNG</text>
  <text x="960" y="68" class="subtitle" text-anchor="middle">Bố cục ngang 16:9 dùng cho slide thuyết trình</text>

  <!-- Swimlanes -->
  <rect x="30" y="90" width="540" height="980" fill="#f8fbff" stroke="#374151" stroke-width="2"/>
  <rect x="570" y="90" width="620" height="980" fill="#fffdf6" stroke="#374151" stroke-width="2"/>
  <rect x="1190" y="90" width="700" height="980" fill="#f8fff8" stroke="#374151" stroke-width="2"/>
  <rect x="30" y="90" width="540" height="52" fill="#dcecff" stroke="#374151" stroke-width="2"/>
  <rect x="570" y="90" width="620" height="52" fill="#fff0bd" stroke="#374151" stroke-width="2"/>
  <rect x="1190" y="90" width="700" height="52" fill="#dff1df" stroke="#374151" stroke-width="2"/>
  <text x="300" y="123" class="laneTitle" text-anchor="middle">Khách hàng</text>
  <text x="880" y="123" class="laneTitle" text-anchor="middle">Hệ thống SmartDining</text>
  <text x="1540" y="123" class="laneTitle" text-anchor="middle">Bếp / Nhân viên</text>

  <!-- Start and ordering -->
  <circle cx="300" cy="170" r="13" fill="#000000"/>
  <path class="flow" d="M300 183 V195"/>

  <rect x="100" y="195" width="380" height="60" rx="14" class="customer"/>
  <text x="290" y="232" class="actionText">Quét QR, vào giao diện theo bàn</text>
  <path class="flow" d="M480 225 H700"/>

  <rect x="700" y="195" width="360" height="60" rx="14" class="system"/>
  <text x="880" y="232" class="actionText">Hiển thị thực đơn</text>
  <path class="flow" d="M880 255 V273 H290 V290"/>

  <rect x="100" y="290" width="380" height="60" rx="14" class="customer"/>
  <text x="290" y="327" class="actionText">Chọn món và gửi order</text>
  <path class="flow" d="M480 320 H700"/>

  <rect x="700" y="290" width="360" height="60" rx="14" class="system"/>
  <text x="880" y="327" class="actionText">Gửi order xuống bếp</text>
  <path class="flow" d="M1060 320 H1320"/>

  <rect x="1320" y="290" width="440" height="60" rx="14" class="operations"/>
  <text x="1540" y="315" class="actionText">Bếp nhận order, chế biến</text>
  <text x="1540" y="336" class="smallText">và báo món sẵn sàng</text>
  <path class="flow" d="M1540 350 V390"/>

  <rect x="1320" y="390" width="440" height="60" rx="14" class="operations"/>
  <text x="1540" y="427" class="actionText">Nhân viên mang món ra phục vụ</text>
  <path class="flow" d="M1320 420 H980 V450 H480"/>

  <rect x="100" y="420" width="380" height="60" rx="14" class="customer"/>
  <text x="290" y="457" class="actionText">Nhận món và dùng bữa</text>
  <path class="flow" d="M290 480 V485"/>

  <!-- Call-staff request -->
  <path d="M290 485 L365 545 L290 605 L215 545 Z" class="decision"/>
  <text x="290" y="540" class="smallText">Cần gọi</text>
  <text x="290" y="560" class="smallText">nhân viên?</text>

  <path class="flow" d="M215 545 H85 V650 H100"/>
  <text x="115" y="530" class="label">Có</text>
  <rect x="100" y="620" width="380" height="60" rx="14" class="customer"/>
  <text x="290" y="646" class="actionText">Gửi yêu cầu gọi nhân viên</text>
  <text x="290" y="667" class="smallText">Ví dụ: thêm dụng cụ hoặc hỗ trợ khác</text>
  <rect x="1320" y="700" width="440" height="60" rx="14" class="operations"/>
  <text x="1540" y="737" class="actionText">Nhân viên tiếp nhận và xử lý</text>

  <text x="378" y="530" class="label">Không</text>

  <rect x="100" y="700" width="380" height="60" rx="14" class="customer"/>
  <text x="290" y="737" class="actionText">Tiếp tục dùng bữa</text>
  <path class="flow" d="M480 650 H1540 V700"/>
  <path class="flow" d="M365 545 H600 V690 H290 V700"/>
  <path class="flow" d="M1320 730 H480"/>
  <path class="flow" d="M290 760 V775"/>

  <!-- Payment -->
  <path d="M290 775 L365 830 L290 885 L215 830 Z" class="decision"/>
  <text x="290" y="825" class="smallText">Đã dùng</text>
  <text x="290" y="846" class="smallText">xong?</text>

  <path class="flow" d="M215 830 H65 V730 H100"/>
  <text x="88" y="815" class="label">Chưa</text>
  <path class="flow" d="M365 830 H520 V922 H480"/>
  <text x="380" y="815" class="label">Rồi</text>

  <rect x="100" y="892" width="380" height="60" rx="14" class="customer"/>
  <text x="290" y="929" class="actionText">Gửi yêu cầu thanh toán</text>
  <path class="flow" d="M480 922 H1320"/>

  <rect x="1320" y="892" width="440" height="60" rx="14" class="operations"/>
  <text x="1540" y="929" class="actionText">Nhân viên xác nhận thanh toán</text>
  <path class="flow" d="M1320 922 H1080 V992 H1060"/>

  <rect x="700" y="962" width="360" height="60" rx="14" class="system"/>
  <text x="880" y="999" class="actionText">Thông báo hoàn tất</text>
  <path class="flow" d="M880 1022 V1042"/>

  <!-- One and only one activity final node -->
  <circle cx="880" cy="1042" r="20" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <circle cx="880" cy="1042" r="12" fill="#000000"/>
</svg>
