<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1880" viewBox="0 0 2200 1880" role="img" aria-labelledby="title description">
  <title id="title">Activity Diagram - Đăng nhập SmartDining</title>
  <desc id="description">Sơ đồ hoạt động đăng nhập SmartDining gồm ba swimlane: Người dùng, Hệ thống và Cơ sở dữ liệu SQL Server.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .frame { fill: none; stroke: #0f172a; stroke-width: 4; }
      .lane-user { fill: #f8fafc; }
      .lane-system { fill: #fffdf7; }
      .lane-db { fill: #f7fbff; }
      .lane-head-user { fill: #dbeafe; }
      .lane-head-system { fill: #fef3c7; }
      .lane-head-db { fill: #dbeafe; }
      .divider { stroke: #334155; stroke-width: 3; }
      .lane-title { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 700; font-size: 30px; fill: #0f172a; text-anchor: middle; }
      .title { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 800; font-size: 38px; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 20px; fill: #475569; text-anchor: middle; }
      .box { filter: url(#shadow); stroke-width: 2.5; }
      .user-box { fill: #eff6ff; stroke: #2563eb; }
      .system-box { fill: #fffbeb; stroke: #d97706; }
      .db-box { fill: #eff6ff; stroke: #0284c7; }
      .success-box { fill: #f0fdf4; stroke: #16a34a; }
      .error-box { fill: #fff1f2; stroke: #dc2626; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; filter: url(#shadow); }
      .label { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 600; font-size: 24px; fill: #111827; text-anchor: middle; }
      .label-small { font-family: Arial, 'DejaVu Sans', sans-serif; font-weight: 600; font-size: 21px; fill: #111827; text-anchor: middle; }
      .note { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 17px; fill: #475569; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 3.2; marker-end: url(#arrow); stroke-linejoin: round; }
      .flow-return { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrow); stroke-linejoin: round; }
      .flow-label { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 20px; font-weight: 700; fill: #334155; }
      .legend { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 18px; fill: #334155; }
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1880"/>
  <text class="title" x="1100" y="50">ACTIVITY DIAGRAM – QUY TRÌNH ĐĂNG NHẬP SMARTDINING</text>
  <text class="subtitle" x="1100" y="82">Căn cứ LoginServlet, EmployeeDAOImpl, SecurityUtil và bảng Employees</text>

  <!-- Swimlanes -->
  <rect class="lane-user" x="30" y="110" width="510" height="1710"/>
  <rect class="lane-system" x="540" y="110" width="1080" height="1710"/>
  <rect class="lane-db" x="1620" y="110" width="550" height="1710"/>
  <rect class="lane-head-user" x="30" y="110" width="510" height="65"/>
  <rect class="lane-head-system" x="540" y="110" width="1080" height="65"/>
  <rect class="lane-head-db" x="1620" y="110" width="550" height="65"/>
  <rect class="frame" x="30" y="110" width="2140" height="1710" rx="10"/>
  <line class="divider" x1="540" y1="110" x2="540" y2="1820"/>
  <line class="divider" x1="1620" y1="110" x2="1620" y2="1820"/>
  <line class="divider" x1="30" y1="175" x2="2170" y2="175"/>
  <text class="lane-title" x="285" y="153">Người dùng</text>
  <text class="lane-title" x="1080" y="153">Hệ thống SmartDining</text>
  <text class="lane-title" x="1895" y="153">Cơ sở dữ liệu (SQL Server)</text>

  <!-- User activities -->
  <circle cx="285" cy="230" r="18" fill="#111827"/>
  <path class="flow" d="M285 248 V285"/>
  <rect class="box user-box" x="110" y="285" width="350" height="68" rx="12"/>
  <text class="label" x="285" y="327">Mở trang đăng nhập</text>
  <path class="flow" d="M285 353 V390"/>
  <rect class="box user-box" x="85" y="390" width="400" height="84" rx="12"/>
  <text class="label" x="285" y="425">Nhập tên đăng nhập</text>
  <text class="label" x="285" y="453">và mật khẩu</text>
  <path class="flow" d="M285 474 V510"/>
  <rect class="box user-box" x="110" y="510" width="350" height="68" rx="12"/>
  <text class="label" x="285" y="552">Nhấn nút “Đăng nhập”</text>

  <!-- System receives request -->
  <path class="flow" d="M460 544 H650"/>
  <rect class="box system-box" x="650" y="500" width="510" height="90" rx="12"/>
  <text class="label" x="905" y="535">Tiếp nhận yêu cầu đăng nhập</text>
  <text class="label-small" x="905" y="565">username, password, loginRole (nếu có)</text>
  <path class="flow" d="M905 590 V638"/>
  <rect class="box system-box" x="680" y="638" width="450" height="78" rx="12"/>
  <text class="label" x="905" y="673">Gọi EmployeeDAO</text>
  <text class="label-small" x="905" y="700">findByUsername(username)</text>

  <!-- Database interaction -->
  <path class="flow" d="M1130 677 H1715"/>
  <rect class="box db-box" x="1715" y="622" width="365" height="112" rx="12"/>
  <text class="label-small" x="1898" y="658">Truy vấn bảng Employees</text>
  <text class="label-small" x="1898" y="687">SELECT ... WHERE</text>
  <text class="label-small" x="1898" y="714">Username = :username</text>
  <path class="flow" d="M1715 780 H1130"/>
  <text class="flow-label" x="1295" y="765">Employee hoặc không có bản ghi</text>

  <!-- Account checks -->
  <polygon class="decision" points="905,790 1060,850 905,910 750,850"/>
  <text class="label-small" x="905" y="844">Tìm thấy tài khoản?</text>
  <text class="flow-label" x="1055" y="838">Không</text>
  <path class="flow" d="M1060 850 H1225"/>
  <rect class="box error-box" x="1225" y="808" width="330" height="84" rx="12"/>
  <text class="label-small" x="1390" y="841">Hiển thị lỗi:</text>
  <text class="label-small" x="1390" y="870">“Sai tên đăng nhập hoặc mật khẩu.”</text>

  <text class="flow-label" x="920" y="934">Có</text>
  <path class="flow" d="M905 910 V960"/>
  <polygon class="decision" points="905,960 1090,1025 905,1090 720,1025"/>
  <text class="label-small" x="905" y="1018">Đúng khu vực đăng nhập?</text>
  <text class="label-small" x="905" y="1044">(chỉ áp dụng /login/{role})</text>
  <text class="flow-label" x="1090" y="1013">Không</text>
  <path class="flow" d="M1090 1025 H1225"/>
  <rect class="box error-box" x="1225" y="980" width="330" height="90" rx="12"/>
  <text class="label-small" x="1390" y="1013">Hiển thị lỗi:</text>
  <text class="label-small" x="1390" y="1042">“Tài khoản không thuộc khu vực</text>
  <text class="label-small" x="1390" y="1064">đăng nhập này.”</text>

  <text class="flow-label" x="920" y="1113">Có / không chọn khu vực</text>
  <path class="flow" d="M905 1090 V1145"/>
  <polygon class="decision" points="905,1145 1050,1205 905,1265 760,1205"/>
  <text class="label-small" x="905" y="1200">Status = ACTIVE?</text>
  <text class="flow-label" x="1050" y="1193">Không</text>
  <path class="flow" d="M1050 1205 H1225"/>
  <rect class="box error-box" x="1225" y="1163" width="330" height="84" rx="12"/>
  <text class="label-small" x="1390" y="1196">Hiển thị lỗi:</text>
  <text class="label-small" x="1390" y="1225">“Tài khoản của bạn đã bị khóa.”</text>

  <text class="flow-label" x="920" y="1288">Có</text>
  <path class="flow" d="M905 1265 V1320"/>
  <rect class="box system-box" x="705" y="1320" width="400" height="76" rx="12"/>
  <text class="label" x="905" y="1350">Đối chiếu mật khẩu</text>
  <text class="label-small" x="905" y="1378">PasswordUtil.matches(...)</text>
  <path class="flow" d="M905 1396 V1442"/>
  <polygon class="decision" points="905,1442 1045,1496 905,1550 765,1496"/>
  <text class="label-small" x="905" y="1502">Mật khẩu khớp?</text>
  <text class="flow-label" x="1045" y="1484">Không</text>
  <path class="flow" d="M1045 1496 H1225"/>
  <rect class="box error-box" x="1225" y="1454" width="330" height="84" rx="12"/>
  <text class="label-small" x="1390" y="1487">Hiển thị lỗi:</text>
  <text class="label-small" x="1390" y="1516">“Sai tên đăng nhập hoặc mật khẩu.”</text>

  <!-- Return paths to input -->
  <path class="flow-return" d="M1555 850 H1590 V430 H485"/>
  <path class="flow-return" d="M1555 1025 H1590 V430 H485"/>
  <path class="flow-return" d="M1555 1205 H1590 V430 H485"/>
  <path class="flow-return" d="M1555 1496 H1590 V430 H485"/>
  <text class="legend" x="1170" y="420">Hiển thị lại trang đăng nhập</text>

  <!-- Successful authentication creates an in-memory session and a cookie. -->
  <text class="flow-label" x="920" y="1583">Có</text>
  <path class="flow" d="M905 1550 V1600"/>
  <rect class="box success-box" x="665" y="1600" width="480" height="94" rx="12"/>
  <text class="label-small" x="905" y="1634">Tạo phiên đăng nhập 8 giờ và cookie HttpOnly</text>
  <text class="label-small" x="905" y="1662">theo vai trò (lưu trong bộ nhớ, không ghi CSDL)</text>
  <path class="flow" d="M905 1694 V1735"/>
  <rect class="box success-box" x="665" y="1735" width="480" height="76" rx="12"/>
  <text class="label-small" x="905" y="1765">Chuyển đến dashboard theo vai trò:</text>
  <text class="label-small" x="905" y="1792">ADMIN / STAFF / KITCHEN</text>
  <path class="flow" d="M1145 1773 H1235"/>
  <circle cx="1270" cy="1773" r="28" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="1270" cy="1773" r="18" fill="#111827"/>

  <!-- Footer note -->
  <text class="note" x="50" y="1865">* CSDL chỉ được đọc một lần trong luồng đăng nhập: EmployeeDAOImpl.findByUsername(username). Không có cơ chế tự khóa sau khi đăng nhập sai trong mã nguồn hiện tại.</text>
</svg>
