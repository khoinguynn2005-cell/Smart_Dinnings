<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1600" viewBox="0 0 1800 1600" role="img" aria-labelledby="title description">
  <title id="title">Activity Diagram - Quản trị SmartDining</title>
  <desc id="description">Sơ đồ hoạt động tổng quan cho trang quản trị SmartDining: quản trị viên đăng nhập, hệ thống kiểm tra quyền, tải dashboard, xử lý các nhóm chức năng quản trị, lưu hoặc tra cứu dữ liệu và đăng xuất.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .lane-admin { fill: #f8fafc; }
      .lane-system { fill: #fffdf7; }
      .lane-db { fill: #f7fbff; }
      .head-admin { fill: #dbeafe; }
      .head-system { fill: #fef3c7; }
      .head-db { fill: #dbeafe; }
      .frame { fill: none; stroke: #0f172a; stroke-width: 4; }
      .divider { stroke: #334155; stroke-width: 3; }
      .title { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 36px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 19px; fill: #475569; text-anchor: middle; }
      .lane-title { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 27px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .label { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 22px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .label-small { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 19px; font-weight: 600; fill: #111827; text-anchor: middle; }
      .guard { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 18px; font-weight: 700; fill: #334155; }
      .box { stroke-width: 2.5; filter: url(#shadow); }
      .admin-box { fill: #eff6ff; stroke: #2563eb; }
      .system-box { fill: #fffbeb; stroke: #d97706; }
      .db-box { fill: #eff6ff; stroke: #0284c7; }
      .error-box { fill: #fff1f2; stroke: #dc2626; }
      .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 2.5; filter: url(#shadow); }
      .flow { fill: none; stroke: #1f2937; stroke-width: 3.2; marker-end: url(#arrow); stroke-linejoin: round; }
      .note { font-family: Arial, 'DejaVu Sans', sans-serif; font-size: 17px; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1600"/>
  <text class="title" x="900" y="50">ACTIVITY DIAGRAM – QUẢN TRỊ SMARTDINING</text>
  <text class="subtitle" x="900" y="80">Mức tổng quan cho các chức năng của trang Admin</text>

  <!-- Swimlanes -->
  <rect class="lane-admin" x="30" y="110" width="520" height="1410"/>
  <rect class="lane-system" x="550" y="110" width="710" height="1410"/>
  <rect class="lane-db" x="1260" y="110" width="510" height="1410"/>
  <rect class="head-admin" x="30" y="110" width="520" height="65"/>
  <rect class="head-system" x="550" y="110" width="710" height="65"/>
  <rect class="head-db" x="1260" y="110" width="510" height="65"/>
  <rect class="frame" x="30" y="110" width="1740" height="1410" rx="10"/>
  <line class="divider" x1="550" y1="110" x2="550" y2="1520"/>
  <line class="divider" x1="1260" y1="110" x2="1260" y2="1520"/>
  <line class="divider" x1="30" y1="175" x2="1770" y2="175"/>
  <text class="lane-title" x="290" y="153">Quản trị viên</text>
  <text class="lane-title" x="905" y="153">Hệ thống SmartDining</text>
  <text class="lane-title" x="1515" y="153">Cơ sở dữ liệu</text>

  <!-- Access -->
  <circle cx="290" cy="235" r="18" fill="#111827"/>
  <path class="flow" d="M290 253 V295"/>
  <rect class="box admin-box" x="105" y="295" width="370" height="72" rx="12"/>
  <text class="label" x="290" y="338">Mở trang quản trị</text>
  <path class="flow" d="M475 331 H730"/>
  <rect class="box system-box" x="730" y="288" width="350" height="86" rx="12"/>
  <text class="label-small" x="905" y="323">Kiểm tra đăng nhập</text>
  <text class="label-small" x="905" y="351">và quyền ADMIN</text>
  <path class="flow" d="M905 374 V420"/>
  <polygon class="decision" points="905,420 1040,475 905,530 770,475"/>
  <text class="label-small" x="905" y="481">Có quyền?</text>
  <text class="guard" x="1048" y="464">[Không]</text>
  <path class="flow" d="M1040 475 H1125"/>
  <rect class="box error-box" x="1125" y="435" width="120" height="80" rx="10"/>
  <text class="label-small" x="1185" y="468">Về trang</text>
  <text class="label-small" x="1185" y="493">đăng nhập</text>
  <path class="flow" d="M1185 515 V1343 H933"/>
  <text class="guard" x="920" y="553">[Có]</text>
  <path class="flow" d="M905 530 V585"/>

  <!-- Dashboard -->
  <rect class="box system-box" x="700" y="585" width="410" height="84" rx="12"/>
  <text class="label" x="905" y="621">Tải dashboard Admin</text>
  <text class="label-small" x="905" y="648">và dữ liệu quản lý</text>
  <path class="flow" d="M1110 627 H1355"/>
  <rect class="box db-box" x="1355" y="585" width="320" height="84" rx="12"/>
  <text class="label-small" x="1515" y="620">Tra cứu dữ liệu</text>
  <text class="label-small" x="1515" y="648">nhà hàng</text>
  <path class="flow" d="M1355 710 H1110"/>
  <path class="flow" d="M905 669 V735"/>
  <rect class="box admin-box" x="105" y="700" width="370" height="76" rx="12"/>
  <text class="label" x="290" y="733">Xem dashboard</text>
  <text class="label-small" x="290" y="759">và chọn chức năng</text>
  <path class="flow" d="M475 738 H700"/>

  <!-- Administration work -->
  <rect class="box system-box" x="700" y="735" width="410" height="110" rx="12"/>
  <text class="label-small" x="905" y="772">Xử lý yêu cầu quản trị:</text>
  <text class="label-small" x="905" y="800">thực đơn, bàn/QR, nhân sự</text>
  <text class="label-small" x="905" y="828">hoặc báo cáo</text>
  <path class="flow" d="M1110 790 H1355"/>
  <rect class="box db-box" x="1355" y="748" width="320" height="84" rx="12"/>
  <text class="label-small" x="1515" y="783">Lưu hoặc tra cứu</text>
  <text class="label-small" x="1515" y="811">dữ liệu</text>
  <path class="flow" d="M1355 875 H1110"/>
  <path class="flow" d="M905 845 V910"/>
  <rect class="box system-box" x="700" y="910" width="410" height="84" rx="12"/>
  <text class="label-small" x="905" y="945">Cập nhật giao diện</text>
  <text class="label-small" x="905" y="973">và thông báo kết quả</text>
  <path class="flow" d="M700 952 H475"/>
  <rect class="box admin-box" x="105" y="915" width="370" height="76" rx="12"/>
  <text class="label" x="290" y="948">Tiếp tục quản trị</text>
  <text class="label-small" x="290" y="974">hoặc đăng xuất</text>
  <path class="flow" d="M290 991 V1040"/>
  <polygon class="decision" points="290,1040 425,1095 290,1150 155,1095"/>
  <text class="label-small" x="290" y="1101">Tiếp tục?</text>
  <text class="guard" x="435" y="1085">[Có]</text>
  <path class="flow" d="M425 1095 H610 V738 H700"/>
  <text class="guard" x="300" y="1175">[Không]</text>
  <path class="flow" d="M290 1150 V1210 H730"/>
  <rect class="box system-box" x="730" y="1170" width="350" height="80" rx="12"/>
  <text class="label-small" x="905" y="1203">Đăng xuất và xóa phiên</text>
  <path class="flow" d="M905 1250 V1310"/>
  <circle cx="905" cy="1343" r="28" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <circle cx="905" cy="1343" r="18" fill="#111827"/>

  <text class="note" x="55" y="1485">Ký hiệu UML: nút tròn đen = bắt đầu; hình bo góc = hoạt động; hình thoi = quyết định; vòng tròn kép = kết thúc.</text>
</svg>
